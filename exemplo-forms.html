<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Página de cadastro - Exemplo</h1>
    </header>
    <main>
        <section>
            <form id-"registerForm" method-"POST" >
                <label for-"name">Nome completo:</label> 
                <input type-"text" id-"nome" name-"nome"
                placeholder="name"
                required />
                <br>
                <label for-"email" >informe seu email:</label>
                <input type-"email" id-"type" name-"email"
                placeholder="email"
                required />
                <br>
                <label for-"senha">Digite sua senha:</label>
                <input id-"senha" name-"senha" type-"password"
                placeholder="password"
                required >
                <br>
                <label for-"CPF">Digite seu CPF:</label>
                <input type-"text" id-"PF" name-"CPF"
                placeholder="CPF"
                required />
                <br>
                <textarea id-"mensagem" name-"mensagem" roWs="4" 
                cols="30" placeholder="Digite o texto"></textarea>
                <br>
                <label for="evento">Escolha o evento:</label>
                <select id="evento" name="evento">
                    <option value="rock">Show de Rock</option>
                    <option value="teatro">Teatro: A Comédia da Vida</option>
                </select>
                <label for="termos">
                    <input type="checkbox" id="termos" name="termos" required />
                    Aceito os termos de uso
                </label>
                <p>Forma de pagamento:</p>
                <label><input type="radio" name="pagamento" value="pix" checked /> Pix</label>
                <label><input type="radio" name="pagamento" value="cartao" /> Cartão</label>
                <script>
                    document.getElementById('registerForm').addEventListener('submit', function (event) {
                        event.preventDefault(); // impede o comportamento padrão (recarregar/navegar)

                        const nome = document.getElementById('nome').value;
                        const cpf = document.getElementById('cpf').value;
                        const email = document.getElementById('email').value;

                        alert(`Cadastro recebido!\nNome: ${nome}\nCPF: ${cpf}\nE-mail: ${email}`);
                    });
                </script>
                <input type="submit" value="Cadastrar" />        <!-- dispara o evento submit -->
                <button type="button" onclick="...">Cancelar</button>  <!-- NÃO dispara submit -->
                <main>
                    <section>
                        <h2>Login</h2>
                    </section>
                    <section>
                        <form id="loginForm" method="POST">
                            <label for="loginEmail">E-mail:</label>
                            <input type="email" id="loginEmail" name="email" required />

                            <label for="loginSenha">Senha:</label>
                            <input type="password" id="loginSenha" name="senha" required />

                            <input type="submit" value="Entrar" />
                        </form>
                    </section>
                </main>

                <script>
                    document.getElementById('loginForm').addEventListener('submit', function (event) {
                        event.preventDefault();
                        const email = document.getElementById('loginEmail').value;
                        alert(`Tentativa de login com o e-mail: ${email}`);
                    });
                </script>
                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                    placeholder="000.000.000-00"
                    title="Formato esperado: 000.000.000-00"
                    required
                />
                <form id="registerForm" method="POST" novalidate></form>
                                



                <input type-"submit" value-"Cadastrar"/>

        </form>

    <section>
    </main>
    <footer>
        <p> &copy;Desenvolvido por Arthur</p>
    </footer>

</body>
</html>
